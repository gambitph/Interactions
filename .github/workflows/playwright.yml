name: Playwright Tests
on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Build Interactions Free Plugin
      run: |
        npm ci --legacy-peer-deps
        npm run build:e2e
    - name: Archive plugin build
      run: tar --exclude=./node_modules --exclude=./.git -czf /tmp/interactions-playwright-build.tar.gz .
    - uses: actions/upload-artifact@v4
      with:
        name: interactions-playwright-build
        path: /tmp/interactions-playwright-build.tar.gz
        retention-days: 1

  test:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # interactions-playwright-matrix-start
          - php_version: '8.5'
            wp_version: '7.0.1'
          - php_version: '8.0'
            wp_version: '7.0.1'
          - php_version: '8.0'
            wp_version: '6.8.5'
          - php_version: '8.0'
            wp_version: '6.9.4'
          # interactions-playwright-matrix-end
    name: PHP ${{ matrix.php_version }} and WP ${{ matrix.wp_version || 'latest' }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Restore plugin build
      uses: actions/download-artifact@v4
      with:
        name: interactions-playwright-build
    - name: Extract plugin build
      run: tar -xzf interactions-playwright-build.tar.gz
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Set the version suffix for the output
      run: echo VERSION_SUFFIX=${GITHUB_REF_NAME//\//-} >> $GITHUB_ENV
    - name: Set WP Version and create .wp-env.json
      run: |
        WP_VERSION="${{ matrix.wp_version }}"
        core='"Wordpress/Wordpress#'${{ matrix.wp_version }}'"'

        if [[ -z "$WP_VERSION" || "$WP_VERSION" == "null" ]]; then
          WP_VERSION="latest"
          core=null
        fi

        echo "WP_VERSION=$WP_VERSION" >> $GITHUB_ENV

        echo '{
          "core": '$core',
          "phpVersion": "${{ matrix.php_version }}",
          "plugins": [ ".", "https://downloads.wordpress.org/plugin/elementor.zip" ],
          "config": {
              "SCRIPT_DEBUG": false
            }
          }' > .wp-env.json

        cat .wp-env.json
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      timeout-minutes: 15
      run: |
        for attempt in 1 2 3; do
          npx playwright install chromium --with-deps && exit 0
          echo "Playwright install failed on attempt $attempt"
          sleep $((attempt * 30))
        done
        exit 1
    - name: Start wp-env
      run: npx @wordpress/env start
    - name: Print current WP version
      run: npx @wordpress/env run tests-cli wp core version
    - name: Run playwright tests
      id: run-playwright-tests
      env:
        WP_BASE_URL: http://localhost:8889
        WP_AUTH_STORAGE: wp-auth.json
        WP_USERNAME: admin
        WP_PASSWORD: password
        INTERACTIONS_SLUG: Interactions/interactions
        ELEMENTOR_SLUG: elementor/elementor
      run: npm run test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.run-playwright-tests.outcome == 'failure' }}
      id: artifact-upload-step
      with:
        name: playwright-report-php_${{ matrix.php_version }}-wp_${{ env.WP_VERSION }}-${{ env.VERSION_SUFFIX }}
        path: playwright-report/
        overwrite: true
        retention-days: 30
    - uses: markpatterson27/markdown-to-output@v1
      id: mto
      if: ${{ !cancelled() && steps.run-playwright-tests.outcome == 'failure' }}
      with:
        filepath: ./playwright-interact/errors.md
    - name: Add test results to summary
      if: ${{ !cancelled() && steps.run-playwright-tests.outcome == 'failure' }}
      env:
        SUMMARY_BODY: ${{ steps.mto.outputs.body }}
        REPORT_NAME: playwright-report-php_${{ matrix.php_version }}-wp_${{ env.WP_VERSION }}-${{ env.VERSION_SUFFIX }}
        ARTIFACT_ID: ${{ steps.artifact-upload-step.outputs.artifact-id }}
      run: |
        echo "$SUMMARY_BODY" >> $GITHUB_STEP_SUMMARY
        echo "Report: [${REPORT_NAME}.zip](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${ARTIFACT_ID})" >> $GITHUB_STEP_SUMMARY
